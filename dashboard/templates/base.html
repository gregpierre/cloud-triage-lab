<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cloud Triage Lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">
  {# ---- Sidebar navigation. "active_page" is set by each page template. ---- #}
  <nav class="sidebar" aria-label="Main">
    <a class="brand" href="{{ url_for('index') }}">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.5 4 5.5v6c0 4.7 3.3 8.7 8 10 4.7-1.3 8-5.3 8-10v-6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Cloud Triage Lab</span>
    </a>
    <a class="nav-item{% if active_page == "dashboard" %} is-active{% endif %}" href="{{ url_for('index') }}"{% if active_page == "dashboard" %} aria-current="page"{% endif %} title="Dashboard">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="3" y="3" width="6" height="6" rx="1.2"/><rect x="11" y="3" width="6" height="6" rx="1.2"/>
        <rect x="3" y="11" width="6" height="6" rx="1.2"/><rect x="11" y="11" width="6" height="6" rx="1.2"/>
      </svg>
      <span>Dashboard</span>
    </a>
    <a class="nav-item{% if active_page == "alerts" %} is-active{% endif %}" href="{{ url_for('alerts_page') }}"{% if active_page == "alerts" %} aria-current="page"{% endif %} title="Alerts">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 3a4.5 4.5 0 0 0-4.5 4.5c0 3.5-1.5 5.5-2 6h13c-.5-.5-2-2.5-2-6A4.5 4.5 0 0 0 10 3z"/>
        <path d="M8.2 16.5a1.9 1.9 0 0 0 3.6 0"/>
      </svg>
      <span>Alerts</span>
    </a>
    <a class="nav-item{% if active_page == "runbooks" %} is-active{% endif %}" href="{{ url_for('runbooks_page') }}"{% if active_page == "runbooks" %} aria-current="page"{% endif %} title="Runbooks">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H16v12H5.5A1.5 1.5 0 0 0 4 16.5z"/>
        <path d="M4 16.5A1.5 1.5 0 0 0 5.5 18H16v-3M7.5 7h5M7.5 10h3.5"/>
      </svg>
      <span>Runbooks</span>
    </a>
  </nav>

<main id="top">
{% block content %}{% endblock %}

  <footer class="muted small">Simulated data for a portfolio project. No real cloud accounts involved.</footer>
</main>
</div>


{# ---- Runbook viewer modal ---- #}
<dialog id="runbook-dialog">
  <div class="dialog-header">
    <div>
      <h2 id="runbook-title">Runbook</h2>
      <p id="runbook-meta" class="muted small"></p>
    </div>
    <button type="button" class="button" id="runbook-close" aria-label="Close runbook">Close</button>
  </div>
  <article id="runbook-body" class="runbook-body"></article>
</dialog>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
